'}"></span>Sejna soba ${r}</strong><small>${arr.length} dogodkov</small></div>${rows}</article>`}).join('')}</div>`}$('#content').innerHTML=html;document.querySelectorAll('[data-monthday]').forEach(el=>el.onclick=()=>{focus=fromDate(el.dataset.monthday);view='day';render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEvent(events.find(e=>e.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeEvent(b.dataset.delete))}
